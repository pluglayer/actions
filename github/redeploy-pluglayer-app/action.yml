name: Redeploy PlugLayer App
description: Redeploy an existing PlugLayer app so it rolls out the most recently uploaded image.

inputs:
  api_token:
    description: PlugLayer API token stored in GitHub secrets.
    required: true
  app_id:
    description: Existing PlugLayer app id.
    required: true
  api_url:
    description: PlugLayer API base URL.
    required: false
    default: https://api.pluglayer.com

outputs:
  task_id:
    description: Redeploy task id queued by PlugLayer.
    value: ${{ steps.redeploy.outputs.task_id }}

runs:
  using: composite
  steps:
    - id: redeploy
      shell: bash
      run: |
        set -euo pipefail

        API_URL="$(printf '%s' "$PLUGLAYER_API_URL_RAW" | tr -d '\r\n' | sed 's/[[:space:]]*$//')"

        BODY_FILE="$(mktemp)"
        STATUS="$(
          curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -X POST "${API_URL}/v1/plugin/apps/${PLUGLAYER_APP_ID}/redeploy" \
            -H "Authorization: Bearer ${PLUGLAYER_API_TOKEN}"
        )"

        if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
          export BODY_FILE STATUS
          python3 -c 'import json, os, sys; from pathlib import Path; body = Path(os.environ["BODY_FILE"]).read_text(); status = os.environ["STATUS"]; detail = body.strip(); ns = {"json": json, "body": body}; exec("try:\\n payload=json.loads(body)\\nexcept Exception:\\n payload=None", ns); payload = ns.get("payload"); detail = (payload.get("detail") or payload.get("message") or (payload.get("data") or {}).get("detail") or (payload.get("data") or {}).get("message") or (payload.get("data") or {}).get("error_message") or detail) if isinstance(payload, dict) else detail; print(f"PlugLayer app redeploy failed ({status}): {detail}", file=sys.stderr)'
          exit 1
        fi

        export BODY_FILE GITHUB_OUTPUT
        python3 -c 'import json, os; from pathlib import Path; payload = json.loads(Path(os.environ["BODY_FILE"]).read_text()); data = payload.get("data") if isinstance(payload, dict) and payload.get("ok") is True else payload; fh = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); fh.write(f"task_id={(data or {}).get(\"task_id\", \"\")}\n"); fh.close()'
      env:
        PLUGLAYER_API_TOKEN: ${{ inputs.api_token }}
        PLUGLAYER_APP_ID: ${{ inputs.app_id }}
        PLUGLAYER_API_URL_RAW: ${{ inputs.api_url }}
