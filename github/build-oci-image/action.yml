name: Build OCI Image
description: Build a multi-architecture OCI image archive for PlugLayer deployments.

inputs:
  context:
    description: Docker build context path.
    required: false
    default: .
  dockerfile:
    description: Optional Dockerfile path.
    required: false
    default: ""
  image_name:
    description: Image name used only for tagging the local build.
    required: true
  image_tag:
    description: Image tag/version used for the local build.
    required: true
  archive_path:
    description: OCI archive output path.
    required: true
  platforms:
    description: Target platforms for the OCI archive.
    required: false
    default: linux/amd64,linux/arm64
  build_env_json:
    description: Optional JSON object of build-time env vars/build args to inject into docker buildx.
    required: false
    default: ""

outputs:
  archive_path:
    description: Built OCI archive path.
    value: ${{ steps.build.outputs.archive_path }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - id: build
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$(dirname "$PLUGLAYER_ARCHIVE_PATH")"

        ARGS=(
          docker buildx build
          --platform "$PLUGLAYER_PLATFORMS"
          --output "type=oci,dest=$PLUGLAYER_ARCHIVE_PATH"
          --tag "$PLUGLAYER_IMAGE_NAME:$PLUGLAYER_IMAGE_TAG"
        )

        if [[ -n "$PLUGLAYER_DOCKERFILE" ]]; then
          ARGS+=( -f "$PLUGLAYER_DOCKERFILE" )
        fi

        if [[ -n "$PLUGLAYER_BUILD_ENV_JSON" ]]; then
          BUILD_ARGS_FILE="$(mktemp)"
          export BUILD_ARGS_FILE
          python3 -c 'import json, os, sys; raw=os.environ.get("PLUGLAYER_BUILD_ENV_JSON","").strip(); path=os.environ["BUILD_ARGS_FILE"]; payload={} if not raw else json.loads(raw); isinstance(payload, dict) or (_ for _ in ()).throw(SystemExit("build_env_json must be a JSON object of key/value pairs")); open(path, "w", encoding="utf-8").write("".join(f"{k}={v}\n" for k, v in payload.items() if v is not None))'
          while IFS= read -r build_arg; do
            [[ -n "$build_arg" ]] || continue
            ARGS+=( --build-arg "$build_arg" )
          done < "$BUILD_ARGS_FILE"
          rm -f "$BUILD_ARGS_FILE"
        fi

        ARGS+=( "$PLUGLAYER_CONTEXT" )

        "${ARGS[@]}"

        echo "archive_path=$PLUGLAYER_ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
      env:
        PLUGLAYER_CONTEXT: ${{ inputs.context }}
        PLUGLAYER_DOCKERFILE: ${{ inputs.dockerfile }}
        PLUGLAYER_IMAGE_NAME: ${{ inputs.image_name }}
        PLUGLAYER_IMAGE_TAG: ${{ inputs.image_tag }}
        PLUGLAYER_ARCHIVE_PATH: ${{ inputs.archive_path }}
        PLUGLAYER_PLATFORMS: ${{ inputs.platforms }}
        PLUGLAYER_BUILD_ENV_JSON: ${{ inputs.build_env_json }}
