name: Upload Image to PlugLayer
description: Upload an OCI image archive to PlugLayer and attach it to an existing app without restarting yet.

inputs:
  api_token:
    description: PlugLayer API token stored in GitHub secrets.
    required: true
  app_id:
    description: Existing PlugLayer app id.
    required: true
  archive_path:
    description: Path to the OCI archive to upload.
    required: true
  image_tag:
    description: Image tag/version to store on the app.
    required: true
  api_url:
    description: PlugLayer API base URL.
    required: false
    default: https://api.pluglayer.com
  registry_id:
    description: Optional PlugLayer registry id override.
    required: false
    default: ""

outputs:
  mirrored_image:
    description: Mirrored image reference created by PlugLayer.
    value: ${{ steps.upload.outputs.mirrored_image }}
  app_id:
    description: App id that was updated.
    value: ${{ steps.upload.outputs.app_id }}

runs:
  using: composite
  steps:
    - id: upload
      shell: bash
      run: |
        set -euo pipefail

        API_URL="$(printf '%s' "$PLUGLAYER_API_URL_RAW" | tr -d '\r\n' | sed 's/[[:space:]]*$//')"

        if [[ ! -f "$PLUGLAYER_ARCHIVE_PATH" ]]; then
          echo "Archive not found: $PLUGLAYER_ARCHIVE_PATH" >&2
          exit 1
        fi

        BODY_FILE="$(mktemp)"
        STATUS="$(
          curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -X POST "${API_URL}/v1/plugin/apps/${PLUGLAYER_APP_ID}/upload-image" \
            -H "Authorization: Bearer ${PLUGLAYER_API_TOKEN}" \
            -F "archive=@${PLUGLAYER_ARCHIVE_PATH}" \
            -F "tag=${PLUGLAYER_IMAGE_TAG}" \
            -F "registry_id=${PLUGLAYER_REGISTRY_ID}"
        )"

        if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
          export BODY_FILE STATUS
          python3 -c 'import json, os, sys; from pathlib import Path; body = Path(os.environ["BODY_FILE"]).read_text(); status = os.environ["STATUS"]; detail = body.strip(); ns = {"json": json, "body": body}; exec("try:\\n payload=json.loads(body)\\nexcept Exception:\\n payload=None", ns); payload = ns.get("payload"); detail = (payload.get("detail") or payload.get("message") or (payload.get("data") or {}).get("detail") or (payload.get("data") or {}).get("message") or (payload.get("data") or {}).get("error_message") or detail) if isinstance(payload, dict) else detail; print(f"PlugLayer image upload failed ({status}): {detail}", file=sys.stderr)'
          exit 1
        fi

        export BODY_FILE GITHUB_OUTPUT
        python3 -c 'import json, os; from pathlib import Path; payload = json.loads(Path(os.environ["BODY_FILE"]).read_text()); data = payload.get("data") if isinstance(payload, dict) and payload.get("ok") is True else payload; app = (data or {}).get("app") or {}; fh = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); fh.write(f"mirrored_image={(data or {}).get(\"mirrored_image\", \"\")}\n"); fh.write(f"app_id={app.get(\"id\", \"\")}\n"); fh.close()'
      env:
        PLUGLAYER_API_TOKEN: ${{ inputs.api_token }}
        PLUGLAYER_APP_ID: ${{ inputs.app_id }}
        PLUGLAYER_ARCHIVE_PATH: ${{ inputs.archive_path }}
        PLUGLAYER_IMAGE_TAG: ${{ inputs.image_tag }}
        PLUGLAYER_API_URL_RAW: ${{ inputs.api_url }}
        PLUGLAYER_REGISTRY_ID: ${{ inputs.registry_id }}
