name: Apply PlugLayer Env and Restart
description: Merge CI-provided env vars onto an existing PlugLayer app and then restart or redeploy it.

inputs:
  api_token:
    description: PlugLayer API token stored in GitHub secrets.
    required: true
  app_id:
    description: Existing PlugLayer app id.
    required: true
  env_json:
    description: Optional JSON object of env vars to merge, usually from a GitHub secret.
    required: false
    default: ""
  merge:
    description: Merge env vars onto the existing env set.
    required: false
    default: "true"
  restart_mode:
    description: One of restart, redeploy, or none.
    required: false
    default: restart
  api_url:
    description: PlugLayer API base URL.
    required: false
    default: https://api.pluglayer.com

outputs:
  task_id:
    description: Restart/redeploy task id if one was queued.
    value: ${{ steps.apply.outputs.task_id }}

runs:
  using: composite
  steps:
    - id: apply
      shell: bash
      run: |
        set -euo pipefail

        BODY_FILE="$(mktemp)"
        PAYLOAD_FILE="$(mktemp)"
        API_URL="$(printf '%s' "$PLUGLAYER_API_URL_RAW" | tr -d '\r\n' | sed 's/[[:space:]]*$//')"

        export PAYLOAD_FILE
        python3 -c 'import json, os, sys; env_json = os.environ.get("PLUGLAYER_ENV_JSON", "").strip(); env_vars = json.loads(env_json) if env_json else {}; isinstance(env_vars, dict) or (_ for _ in ()).throw(SystemExit("env_json must be a JSON object")); payload = {"env_vars": env_vars, "merge": os.environ.get("PLUGLAYER_MERGE", "true").lower() != "false", "restart_mode": os.environ.get("PLUGLAYER_RESTART_MODE", "restart")}; open(os.environ["PAYLOAD_FILE"], "w", encoding="utf-8").write(json.dumps(payload))'

        STATUS="$(
          curl -sS -o "$BODY_FILE" -w "%{http_code}" \
            -X POST "${API_URL}/v1/plugin/apps/${PLUGLAYER_APP_ID}/env/apply" \
            -H "Authorization: Bearer ${PLUGLAYER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$PAYLOAD_FILE"
        )"

        if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
          export BODY_FILE STATUS
          python3 -c 'import json, os, sys; from pathlib import Path; body = Path(os.environ["BODY_FILE"]).read_text(); status = os.environ["STATUS"]; detail = body.strip(); ns = {"json": json, "body": body}; exec("try:\\n payload=json.loads(body)\\nexcept Exception:\\n payload=None", ns); payload = ns.get("payload"); detail = (payload.get("detail") or payload.get("message") or (payload.get("data") or {}).get("detail") or (payload.get("data") or {}).get("message") or (payload.get("data") or {}).get("error_message") or detail) if isinstance(payload, dict) else detail; print(f"PlugLayer env apply failed ({status}): {detail}", file=sys.stderr)'
          exit 1
        fi

        export BODY_FILE GITHUB_OUTPUT
        python3 -c 'import json, os; from pathlib import Path; payload = json.loads(Path(os.environ["BODY_FILE"]).read_text()); data = payload.get("data") if isinstance(payload, dict) and payload.get("ok") is True else payload; fh = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"); fh.write(f"task_id={(data or {}).get(\"task_id\", \"\")}\n"); fh.close()'
      env:
        PLUGLAYER_API_TOKEN: ${{ inputs.api_token }}
        PLUGLAYER_APP_ID: ${{ inputs.app_id }}
        PLUGLAYER_API_URL_RAW: ${{ inputs.api_url }}
        PLUGLAYER_ENV_JSON: ${{ inputs.env_json }}
        PLUGLAYER_MERGE: ${{ inputs.merge }}
        PLUGLAYER_RESTART_MODE: ${{ inputs.restart_mode }}
